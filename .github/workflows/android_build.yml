name: Build Kids Target APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: |
        echo "Starting Gradle Build for Android 10+ (API 29+)..."
        ./gradlew assembleDebug > build_output.log 2>&1 || BUILD_FAILED=true

        if [ "$BUILD_FAILED" = true ]; then
          echo "❌ Build failed! Saving log file..."
          cp build_output.log build_error_log.txt
          exit 1
        else
          echo "✅ Build completed successfully! APK generated."
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Error Log if Build Fails
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: build_error_log.txt
