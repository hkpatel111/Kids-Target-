name: Build Kids Target Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Build Debug APK / Gradle Check with Error Logging
      id: build_step
      run: |
        echo "=========================================="
        echo "Starting Gradle Build for Android 10+"
        echo "=========================================="
        
        BUILD_FAILED=false
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug > build_output.log 2>&1 || BUILD_FAILED=true
        else
          echo "Error: Gradle wrapper (gradlew) not found in the root directory!" > build_output.log
          BUILD_FAILED=true
        fi

        if [ "$BUILD_FAILED" = true ]; then
          echo "❌ Build failed! Generating error log file..."
          cp build_output.log build_error_log.txt
          exit 1
        else
          echo "✅ Build completed successfully!"
        fi

    - name: Upload Error Log if Build Fails
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: build_error_log.txt
