name: Build Kids Target APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Locate Project Root & Prepare Gradle
      run: |
        echo "Searching for build.gradle in repository..."
        if [ -f "build.gradle" ]; then
          echo "Project root is repository root."
        elif [ -f "kids_target_app/build.gradle" ]; then
          echo "Moving into kids_target_app directory..."
          cd kids_target_app
        else
          # Find any folder containing build.gradle
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" -not -path "./.git/*" | head -n 1))
          if [ "$PROJECT_DIR" != "." ] && [ -n "$PROJECT_DIR" ]; then
            echo "Found project in $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
        fi

        # Make sure gradlew exists and is executable
        if [ ! -f "gradlew" ]; then
          echo "Generating gradle wrapper..."
          gradle wrapper
        fi
        chmod +x ./gradlew

        echo "Starting Gradle Build..."
        ./gradlew assembleDebug > ../build_output.log 2>&1 || exit 1
        
        # Move APK to root for artifact collection
        mkdir -p ../app/build/outputs/apk/debug/
        cp app/build/outputs/apk/debug/app-debug.apk ../app/build/outputs/apk/debug/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
