name: Build Kids Target APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Initialize Gradle Wrapper & Build APK
      run: |
        echo "=== Checking Project Structure ==="
        ls -la
        
        if [ ! -f "gradlew" ]; then
          echo "⚠️ gradlew not found. Generating Gradle wrapper..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        echo "=== Starting Gradle Build (Android 10+ / API 29+) ==="
        ./gradlew assembleDebug > build_output.log 2>&1 || BUILD_FAILED=true

        if [ "$BUILD_FAILED" = true ]; then
          echo "❌ Build failed! Printing error log:"
          cat build_output.log
          cp build_output.log build_error_log.txt
          exit 1
        else
          echo "✅ Build completed successfully!"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Error Log if Failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: build_error_log.txt
        
